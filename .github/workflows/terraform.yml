name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # für die Anmeldung bei AWS per OIDC

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  checks:
    name: Format, Validierung, Sicherheits-Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true

  plan:
    name: terraform plan
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color | tee plan.txt
          {
            echo '## terraform plan'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: terraform apply und Upload
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform apply
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
          echo "BUCKET=$(terraform output -raw primary_bucket)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$(terraform output -raw distribution_id)" >> "$GITHUB_ENV"
          echo "WEBSITE_URL=$(terraform output -raw website_url)" >> "$GITHUB_ENV"

      - name: Website hochladen
        run: aws s3 sync website/ "s3://${BUCKET}" --delete

      - name: Cache-Invalidierung
        run: aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths "/*"

      - name: Adresse ausgeben
        run: |
          echo "Website: ${WEBSITE_URL}" >> "$GITHUB_STEP_SUMMARY"
